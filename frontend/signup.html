<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up — InvoX AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/auth.css">

</head>

<body class="auth-page">

    <!-- MAIN -->
    <main class="auth-main signup-main">

        <div class="glow glow-left"></div>
        <div class="glow glow-bottom"></div>


        <div class="auth-card signup-card">

            <div class="auth-content">

                <div class="auth-heading">

                    <h1>
                        Create Your <span>Account</span>
                    </h1>

                    <p>
                        Join InvoX AI and start managing your invoices smarter.
                    </p>

                </div>


                <form id="signupForm">

                    <!-- NAME -->
                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <div class="input-wrapper">

                            <svg class="input-icon"
                                 viewBox="0 0 24 24"
                                 fill="none">

                                <circle cx="12"
                                        cy="8"
                                        r="4"
                                        stroke="currentColor"
                                        stroke-width="1.8"/>

                                <path d="M4 21
                                         C4.8 16.5
                                         7.5 14
                                         12 14
                                         C16.5 14
                                         19.2 16.5
                                         20 21"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"/>

                            </svg>

                            <input
                                type="text"
                                id="name"
                                placeholder="John Doe"
                                required
                            >

                        </div>

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email address
                        </label>

                        <div class="input-wrapper">

                            <svg class="input-icon"
                                 viewBox="0 0 24 24"
                                 fill="none">

                                <rect x="3" y="5"
                                      width="18"
                                      height="14"
                                      rx="2"
                                      stroke="currentColor"
                                      stroke-width="1.8"/>

                                <path d="M3 7L12 13L21 7"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"
                                      stroke-linejoin="round"/>

                            </svg>

                            <input
                                type="email"
                                id="email"
                                placeholder="you@example.com"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <svg class="input-icon"
                                 viewBox="0 0 24 24"
                                 fill="none">

                                <rect x="5" y="10"
                                      width="14"
                                      height="10"
                                      rx="2"
                                      stroke="currentColor"
                                      stroke-width="1.8"/>

                                <path d="M8 10V7
                                         C8 4.8 9.8 3
                                         12 3
                                         C14.2 3 16 4.8
                                         16 7V10"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"/>

                            </svg>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="password"
                            >

                                <svg viewBox="0 0 24 24"
                                     fill="none">

                                    <path d="M2 12
                                             C5 7 8 5
                                             12 5
                                             C16 5 19 7
                                             22 12
                                             C19 17 16 19
                                             12 19
                                             C8 19 5 17 2 12Z"
                                          stroke="currentColor"
                                          stroke-width="1.8"/>

                                    <circle cx="12"
                                            cy="12"
                                            r="3"
                                            stroke="currentColor"
                                            stroke-width="1.8"/>

                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-wrapper">

                            <svg class="input-icon"
                                 viewBox="0 0 24 24"
                                 fill="none">

                                <rect x="5" y="10"
                                      width="14"
                                      height="10"
                                      rx="2"
                                      stroke="currentColor"
                                      stroke-width="1.8"/>

                                <path d="M8 10V7
                                         C8 4.8 9.8 3
                                         12 3
                                         C14.2 3
                                         16 4.8
                                         16 7V10"
                                      stroke="currentColor"
                                      stroke-width="1.8"
                                      stroke-linecap="round"/>

                            </svg>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                            >

                                <svg viewBox="0 0 24 24"
                                     fill="none">

                                    <path d="M2 12
                                             C5 7 8 5
                                             12 5
                                             C16 5 19 7
                                             22 12
                                             C19 17 16 19
                                             12 19
                                             C8 19 5 17 2 12Z"
                                          stroke="currentColor"
                                          stroke-width="1.8"/>

                                    <circle cx="12"
                                            cy="12"
                                            r="3"
                                            stroke="currentColor"
                                            stroke-width="1.8"/>

                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- BUTTON -->
                    <button type="submit" class="auth-button">
                        Sign Up
                    </button>

                </form>


                <!-- DIVIDER -->
                <div class="divider">

                    <span></span>

                    <p>OR</p>

                    <span></span>

                </div>


                <!-- LOGIN -->
                <p class="switch-text">

                    Already have an account?

                    <a href="login.html">
                        Sign In
                    </a>

                </p>

            </div>

        </div>


        <p class="auth-footer">
            AI-powered invoice intelligence
        </p>

    </main>


    <script src="js/auth.js"></script>

</body>
</html>
